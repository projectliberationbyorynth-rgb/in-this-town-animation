
name: Render 3D Test

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render 3D animation
        run: |
          npx remotion render \
            src/index.ts \
            Town3DTest \
            output.mp4 \
            --codec h264 \
            --concurrency 2

      - name: Upload rendered MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-3d-test
          path: output.mp4
          if-no-files-found: warn
          
